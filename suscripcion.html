<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción - La Página Millonaria</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="suscripcion.css">
</head>
<body>
    <header>
        <a href="index.html">← Volver a la noticia</a>
        <h1>Suscripción al Diario</h1>
        <p>Completá el formulario para acceder a contenido exclusivo.</p>
        <hr>
    </header>

    <main>
        <p class="form-title" id="form-title">HOLA</p>

        <form id="subscription-form" novalidate>

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Juan Pérez">
                <span class="error-msg" id="error-nombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@mail.com">
                <span class="error-msg" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres">
                <span class="error-msg" id="error-password"></span>
            </div>

            <div class="form-group">
                <label for="repetir-password">Repetir contraseña</label>
                <input type="password" id="repetir-password" name="repetir-password" placeholder="Repetí tu contraseña">
                <span class="error-msg" id="error-repetir-password"></span>
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" placeholder="18">
                <span class="error-msg" id="error-edad"></span>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" name="telefono" placeholder="3411234567">
                <span class="error-msg" id="error-telefono"></span>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Av. Pellegrini 1234">
                <span class="error-msg" id="error-direccion"></span>
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Rosario">
                <span class="error-msg" id="error-ciudad"></span>
            </div>

            <div class="form-group">
                <label for="codigo-postal">Código postal</label>
                <input type="text" id="codigo-postal" name="codigo-postal" placeholder="S2000">
                <span class="error-msg" id="error-codigo-postal"></span>
            </div>

            <div class="form-group">
                <label for="dni">DNI</label>
                <input type="text" id="dni" name="dni" placeholder="12345678">
                <span class="error-msg" id="error-dni"></span>
            </div>

            <div class="btn-wrapper">
                <button type="submit" class="btn-enviar">Enviar</button>
            </div>

        </form>
    </main>

    <footer>
        <a href="https://lapaginamillonaria.com/">La Página Millonaria</a>
        <a href="index.html">← Volver a la noticia</a>
    </footer>

</body>
</html>
